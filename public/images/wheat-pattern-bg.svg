    <!-- Floating Grain Particles -->
    <ellipse cx="120" cy="180" rx="4" ry="9" transform="rotate(25 120 180)" fill="url(#grainFill)" stroke-width="1"/>
    <ellipse cx="220" cy="90" rx="4.5" ry="10" transform="rotate(-30 220 90)" fill="url(#grainFill)" stroke-width="1"/>
    <ellipse cx="340" cy="130" rx="3.5" ry="8" transform="rotate(40 340 130)" fill="url(#grainFill)" stroke-width="1"/>
    <ellipse cx="140" cy="310" rx="4" ry="9" transform="rotate(-15 140 310)" fill="url(#grainFill)" stroke-width="1"/>
