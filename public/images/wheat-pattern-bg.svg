<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <!-- Soft Ambient Glow -->
  <defs>
    <linearGradient id="wheatGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF801C" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="grainFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF801C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <g stroke="url(#wheatGoldGrad)" stroke-linecap="round" stroke-linejoin="round">
